# Scrapes the sandbox processes on the host (fixed CLI ports from tests/sandbox/cli.py).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: triage-service
    static_configs:
      - targets: ["host.docker.internal:47101"]
        labels: {service: triage-service}
  - job_name: bed-allocation-service
    static_configs:
      - targets: ["host.docker.internal:47201", "host.docker.internal:47202"]
        labels: {service: bed-allocation-service}
