# Disposable infrastructure for the local sandbox (Compose project "hospital-sandbox").
# Distinct ports and container names from the main compose.yaml; no named volumes (tmpfs only),
# so `down` removes nothing outside this project. TEST-ONLY: not a production Kafka/Pub/Sub design.
name: hospital-sandbox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sandbox-only
      POSTGRES_DB: postgres
    ports: ["45432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports: ["48080:8080"]

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports: ["48085:8085"]

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:49092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["49092:9092"]
    tmpfs: [/tmp/kraft-combined-logs]
  
  zookeeper:
    image: zookeeper:3.9
    ports: ["42181:2181"]
    environment:  # Prometheus metrics on 7000, as in k8s/lock-coordinator/base/zookeeper.yaml
      ZOO_CFG_EXTRA: "metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider metricsProvider.httpPort=7000"
    tmpfs: [/data, /datalog]

  prometheus:
    image: prom/prometheus:v2.50.0
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.sandbox.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/rules/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["49090:9090"]

  grafana:
    image: grafana/grafana:10.3.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sandbox-only
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../../monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["43000:3000"]
    depends_on: [prometheus]
