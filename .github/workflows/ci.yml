name: Local CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GRAFANA_ADMIN_PASSWORD: local-ci-only
      # Disposable CI-only database; no shared or cloud database is reachable from CI.
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:ci-only@localhost:5432/hospital_allocation_ci_test
      FIRESTORE_EMULATOR_HOST: localhost:8080
      # Any skipped integration test fails the job instead of passing silently.
      REQUIRE_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hospital_allocation_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore-emulator -p 8080:8080 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8080
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openapi-spec-validator
      - name: Validate contracts and generated protobufs
        run: |
          python -m openapi_spec_validator contracts/openapi/allocation.openapi.yaml
          python -m openapi_spec_validator contracts/openapi/triage.openapi.yaml
          python -m openapi_spec_validator contracts/openapi/patient-registry-admissions.openapi.yaml
          python scripts/compile_proto.py
          git diff --exit-code -- shared/generated
      - name: Validate infrastructure and local Compose
        run: |
          terraform fmt -check -recursive infra/terraform
          docker compose config --quiet
      - name: Migrate empty database and check model drift
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:ci-only@localhost:5432/hospital_allocation_ci_test
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Wait for Firestore emulator
        run: timeout 60 bash -c 'until curl -sf http://localhost:8080 >/dev/null; do sleep 2; done'
      - name: Run tracked tests
        run: python -m pytest -p no:cacheprovider -q
      - name: Build in-scope service images
        run: |
          docker build -f services/bed_allocation/Dockerfile -t hospital-bed-allocation:ci .
          docker build -f services/triage/Dockerfile -t hospital-triage:ci .
          docker build -f services/patient_registry/Dockerfile -t hospital-patient-registry:ci .
      - name: Smoke-check Allocation image
        run: python scripts/smoke_image.py hospital-bed-allocation:ci
