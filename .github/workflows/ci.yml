name: Local CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.15.8
  KUBECTL_VERSION: v1.36.1
  PROMETHEUS_IMAGE: prom/prometheus:v2.50.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.6.7

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRAFANA_ADMIN_PASSWORD: local-ci-only  # only for `docker compose config` of the main Compose file
      # Sandbox Prometheus/Grafana publish no host ports in CI (tests/sandbox/compose.ci.yaml); the CLI
      # queries them by Compose service DNS, so runner ports in use cannot break infra-up.
      SANDBOX_INTERNAL_OBSERVABILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openapi-spec-validator

      - name: Contracts and generated protobufs
        run: |
          for spec in contracts/openapi/*.yaml; do python -m openapi_spec_validator "$spec"; done
          python scripts/compile_proto.py
          git diff --exit-code -- shared/generated
      - name: Terraform format and offline validation (no backend, no cloud credentials)
        run: |
          terraform fmt -check -recursive infra/terraform
          for dir in infra/terraform infra/terraform/bootstrap infra/terraform/bootstrap_k8s; do
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate -no-color
          done

      - name: Compose files
        run: |
          docker compose config --quiet
          docker compose -f tests/sandbox/compose.yaml config --quiet

      - name: Render, schema-validate and release-gate every Argo CD path
        run: |
          mkdir -p rendered
          # The Argo CD source paths are listed once, in scripts/check_release_config.py (DEFAULT_DIRS).
          dirs=$(python -c "from scripts.check_release_config import DEFAULT_DIRS; print(' '.join(DEFAULT_DIRS))")
          for dir in $dirs; do
            kubectl kustomize "$dir" > "rendered/$(echo "$dir" | tr '/' '_').yaml"
          done
          docker run --rm -v "$PWD/rendered:/m:ro" "$KUBECONFORM_IMAGE"             -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 /m
          # The deployable revision must be fully resolved: no placeholders, digest-pinned repository images.
          python scripts/check_release_config.py | tee rendered/release-gate.txt

      - name: Prometheus rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/rules:/r:ro" "$PROMETHEUS_IMAGE" check rules /r/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/rules:/r:ro" "$PROMETHEUS_IMAGE" test rules /r/alerts.test.yml

      - name: Start sandbox infrastructure
        run: python -m tests.sandbox.cli infra-up

      - name: Full test suite (integration required; any skip fails)
        run: python -m tests.sandbox.cli verify

      - name: Load procedure (reset, seed, k6, invariant audit, observability evidence)
        run: python -m tests.sandbox.cli load --duration 45s --vus 15

      - name: Build and smoke-test images (health, readiness, graceful shutdown)
        run: |
          docker build -f services/bed_allocation/Dockerfile -t hospital-bed-allocation:ci .
          docker build -f services/triage/Dockerfile -t hospital-triage:ci .
          docker build -f services/patient_registry/Dockerfile -t hospital-patient-registry:ci .
          docker build -f services/lock_coordinator/Dockerfile -t hospital-lock-coordinator:ci .
          docker build -f services/notification/Dockerfile -t hospital-notification:ci .
          # hospital_migration_empty_test is left at head by tests/test_migrations_postgres.py; smoke as the runtime role
          python scripts/smoke_image.py hospital-bed-allocation:ci \
            --database-url postgresql+psycopg2://allocation_app:sandbox-only@127.0.0.1:45432/hospital_migration_empty_test
          python scripts/smoke_image.py hospital-triage:ci --service triage --firestore localhost:48080 --port 18003

      - name: Upload test, load, and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precloud-evidence
          path: |
            .sandbox/pytest/
            .sandbox/evidence/
            rendered/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop sandbox infrastructure
        if: always()
        run: python -m tests.sandbox.cli infra-down

  publish-gke-images:
    # Master pushes only, and only once Workload Identity Federation is configured through the repository
    # variables GCP_WIF_PROVIDER and GCP_WIF_SERVICE_ACCOUNT (docs/COMPLETION-GUIDE.md). Without them the job is
    # skipped instead of failing. The provider trusts only this repository's refs/heads/master.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != ''
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: gke-image-promotion-master
      cancel-in-progress: false
    env:
      REGISTRY_PATH: asia-south1-docker.pkg.dev/hospital-management-514618/hospital-repo
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Build, push and digest-pin every GitOps image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          # image | Dockerfile | kustomize directories whose `digest:` for that image is updated
          while read -r name dockerfile dirs; do
            ref="$REGISTRY_PATH/$name:$IMAGE_TAG"
            docker build --file "$dockerfile" --tag "$ref" .
            docker push "$ref"
            pinned="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$ref" | grep "^$REGISTRY_PATH/$name@sha256:" | head -1)"
            test -n "$pinned"
            python scripts/pin_image_digest.py "$name" "${pinned#*@}" ${dirs//,/ }
            echo "$name -> ${pinned#*@}"
          done <<'IMAGES'
          bed-allocation services/bed_allocation/Dockerfile k8s/overlays/staging,k8s/jobs/allocation-migrate
          triage services/triage/Dockerfile k8s/overlays/staging
          bed-registry services/bed_registry/Dockerfile k8s/bed-registry/overlays/gke
          resource-analytics services/resource_analytics/Dockerfile k8s/resource-analytics/overlays/gke
          patient-registry services/patient_registry/Dockerfile k8s/overlays/gke/patient-registry
          staff-scheduler services/staff_scheduler/Dockerfile k8s/overlays/gke/staff-scheduler
          lock-coordinator services/lock_coordinator/Dockerfile k8s/lock-coordinator/overlays/gke
          demo-ui services/demo_ui/Dockerfile k8s/demo-ui
          IMAGES
          # Notification runs on Cloud Run; Terraform (notification_image) decides which tag it uses.
          docker build --file services/notification/Dockerfile --tag "$REGISTRY_PATH/notification:$IMAGE_TAG" .
          docker push "$REGISTRY_PATH/notification:$IMAGE_TAG"
          # Never commit a revision the release gate would reject.
          python scripts/check_release_config.py

      - name: Commit image promotion for Argo CD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
            echo "master advanced after this commit was tested; a newer run will promote its images."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging k8s/jobs/allocation-migrate k8s/bed-registry/overlays/gke \
            k8s/resource-analytics/overlays/gke k8s/overlays/gke/patient-registry k8s/overlays/gke/staff-scheduler \
            k8s/lock-coordinator/overlays/gke k8s/demo-ui
          if git diff --cached --quiet; then
            echo "GitOps image references are already current."
            exit 0
          fi
          # Pushed with GITHUB_TOKEN, so this commit does not start another workflow run (no rebuild loop).
          git commit -m "chore(gitops): promote images ${IMAGE_TAG:0:12}"
          git push origin HEAD:master
