groups:
  - name: hospital_allocation_alerts
    rules:
      - alert: HighLockWaitTime
        expr: histogram_quantile(0.95, sum(rate(lock_wait_seconds_bucket[1m])) by (le, pool_id)) > 1.0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High lock contention on pool {{ $labels.pool_id }}"
          description: "p95 lock wait time is {{ $value }}s on pool {{ $labels.pool_id }}"

      - alert: OutboxDeliveryBacklogHigh
        expr: sum(outbox_pending_events) by (destination) > 100
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Transactional outbox backlog exceeding threshold for destination {{ $labels.destination }}"
          description: "{{ $value }} pending events waiting in outbox table"

      - alert: StaleFencingTokenDetected
        expr: sum(rate(stale_fencing_rejections_total[1m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Stale fencing token mutation rejected in pool {{ $labels.pool_id }}"
          description: "A split-brain or delayed worker attempted an out-of-order mutation"
