apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus          # the dashboards reference this uid
    type: prometheus
    access: proxy
    url: http://gmp-frontend:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 60s   # matches the 60 s scrape interval so $__rate_interval spans >= 2 samples
