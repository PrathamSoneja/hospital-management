# Approved Allocation schema migration. Synced ONLY manually through its own ArgoCD
# Application after the migration change is approved; never part of the app sync.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hospital-system
resources:
  - migration-job.yaml
images:
  - name: bed-allocation
    newName: asia-south1-docker.pkg.dev/hospital-management-514618/hospital-repo/bed-allocation
    digest: sha256:d7650a3c81c8948e50b6079a588bde48df64a0b2e41de6aceb67ca243ced0eb2
configMapGenerator:
  - name: allocation-migration-config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"   # exists before the migration hook runs
    literals:
      - CLOUD_SQL_INSTANCE_CONNECTION_NAME=hospital-management-514618:asia-south1:hospital-postgres
