apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  labels:
    app.kubernetes.io/name: triage-service
    app.kubernetes.io/part-of: hospital-bed-management
spec:
  # No `replicas`: the HPA (2-6) owns the count, and ArgoCD ignores /spec/replicas.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
        app.kubernetes.io/name: triage-service
        app.kubernetes.io/part-of: hospital-bed-management
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: triage-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: triage-service
      containers:
        - name: triage
          image: triage
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-rest
              containerPort: 8000
            - name: grpc-internal
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: triage-config
          env:
            - name: TRIAGE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TRIAGE_REST_HOST
              value: "0.0.0.0"
            - name: TRIAGE_REST_PORT
              value: "8000"
            - name: TRIAGE_GRPC_PORT
              value: "50051"
            - name: START_GRPC
              value: "true"
            - name: TRIAGE_STORAGE_BACKEND
              value: firestore
            - name: TRIAGE_FENCING_MODE
              value: coordinator
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http-rest
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-rest
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness checks Firestore and the Coordinator with 0.5 s bounds each.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-rest
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
