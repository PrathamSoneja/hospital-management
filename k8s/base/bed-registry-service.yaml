apiVersion: v1
kind: Service
metadata:
  name: bed-registry-service
  labels:
    app.kubernetes.io/name: bed-registry-service
    app.kubernetes.io/part-of: hospital-bed-management
spec:
  type: ClusterIP
  selector:
    app: bed-registry-service
  ports:
    - name: http-rest
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: grpc-internal
      port: 50053
      targetPort: 50053
      protocol: TCP
