apiVersion: v1
kind: Service
metadata:
  name: triage-service
  labels:
    app.kubernetes.io/name: triage-service
spec:
  type: ClusterIP
  selector:
    app: triage-service
  ports:
    - name: http-rest
      port: 8000
      targetPort: 8000
    - name: grpc-internal
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-sa
  annotations:
    # Workload Identity Federation binding to GCP Service Account
    iam.gke.io/gcp-service-account: triage-sa@hospital-bed-mgmt-dev.iam.gserviceaccount.com
