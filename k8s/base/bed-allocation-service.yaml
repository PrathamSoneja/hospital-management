apiVersion: v1
kind: Service
metadata:
  name: bed-allocation-service
  labels:
    app.kubernetes.io/name: bed-allocation-service
spec:
  type: ClusterIP
  selector:
    app: bed-allocation-service
  ports:
    - name: http-rest
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bed-allocation-sa
  annotations:
    # Overlay sets the Terraform-created GSA (iam module: <name_prefix>-bed-allocation@<project>.iam.gserviceaccount.com).
    iam.gke.io/gcp-service-account: set-by-overlay
