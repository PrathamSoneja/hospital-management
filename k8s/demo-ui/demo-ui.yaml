apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-ui-sa
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-ui
  labels:
    app: demo-ui
    app.kubernetes.io/name: demo-ui
    app.kubernetes.io/part-of: hospital-bed-management   # admitted by the Allocation/Triage NetworkPolicies
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-ui}
  template:
    metadata:
      labels:
        app: demo-ui
        app.kubernetes.io/name: demo-ui
        app.kubernetes.io/part-of: hospital-bed-management
    spec:
      serviceAccountName: demo-ui-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo-ui
          image: demo-ui
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: ENVIRONMENT, value: production}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-ui
spec:
  type: ClusterIP
  selector: {app: demo-ui}
  ports:
    - {name: http, port: 80, targetPort: http}
