# GKE Secret Manager add-on. The secret (bed-registry-database-url) and the bed-registry GSA's
# secretAccessor binding are defined in infra/terraform; the value (a postgresql+psycopg2 URL for the
# Bed Registry runtime role on 127.0.0.1:5432/beds) is added as a secret version, never in Git.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bed-registry-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/hospital-management-514618/secrets/bed-registry-database-url/versions/latest"
        path: "database-url"
