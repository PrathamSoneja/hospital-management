apiVersion: apps/v1
kind: Deployment
metadata:
  name: bed-registry-service
  labels:
    app.kubernetes.io/name: bed-registry-service
    app.kubernetes.io/part-of: hospital-bed-management
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bed-registry-service
  template:
    metadata:
      labels:
        app: bed-registry-service
        app.kubernetes.io/name: bed-registry-service
        app.kubernetes.io/part-of: hospital-bed-management
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bed-registry-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Native sidecar (restartPolicy: Always), same pattern as Bed Allocation: private IP only,
        # authenticates with the pod's Workload Identity (hospital-bed-registry GSA, roles/cloudsql.client).
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --private-ip
            - --structured-logs
            - --port=5432
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - $(CLOUD_SQL_INSTANCE_CONNECTION_NAME)
          env:
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: bed-registry-config
                  key: CLOUD_SQL_INSTANCE_CONNECTION_NAME
          startupProbe:
            httpGet:
              path: /startup
              port: 9801
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: bed-registry
          image: bed-registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-rest
              containerPort: 8000
            - name: grpc-internal
              containerPort: 50053
          env:
            - name: BED_REGISTRY_REST_HOST
              value: "0.0.0.0"
            - name: BED_REGISTRY_REST_PORT
              value: "8000"
            - name: BED_REGISTRY_GRPC_PORT
              value: "50053"
            - name: START_GRPC
              value: "true"
            - name: ENVIRONMENT
              value: "production"
            - name: AUTO_SEED_DEMO_BEDS
              value: "false"
            # Secret Manager value mounted by the GKE Secret Manager CSI add-on; without it the service
            # refuses to start in this profile (no in-memory fallback).
            - name: BED_REGISTRY_DATABASE_URL_FILE
              value: /var/run/secrets/app/database-url
            # Runtime role has DML only; tables come from the migration Job (services.bed_registry.migrate).
            - name: BED_REGISTRY_CREATE_SCHEMA
              value: "false"
          volumeMounts:
            - name: app-secrets
              mountPath: /var/run/secrets/app
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: app-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bed-registry-secrets
