apiVersion: v1
kind: ServiceAccount
metadata:
  name: staff-scheduler-sa
  annotations:
    iam.gke.io/gcp-service-account: PLACEHOLDER_STAFF_SCHEDULER_GSA
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-scheduler
  labels:
    app.kubernetes.io/name: staff-scheduler
    app.kubernetes.io/part-of: hospital-bed-management
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: staff-scheduler
  template:
    metadata:
      labels:
        app: staff-scheduler
        app.kubernetes.io/name: staff-scheduler
        app.kubernetes.io/part-of: hospital-bed-management
    spec:
      serviceAccountName: staff-scheduler-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: staff-scheduler
          image: staff-scheduler
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 50051
          env:
            - name: STAFF_SCHEDULER_REST_HOST
              value: "0.0.0.0"
            - name: STAFF_SCHEDULER_REST_PORT
              value: "8000"
            - name: STAFF_SCHEDULER_GRPC_HOST
              value: "0.0.0.0"
            - name: STAFF_SCHEDULER_GRPC_PORT
              value: "50051"
            - name: START_GRPC
              value: "true"
            - name: FIRESTORE_PROJECT_ID
              value: PLACEHOLDER_PROJECT_ID
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: staff-scheduler-service
  labels:
    app.kubernetes.io/name: staff-scheduler
spec:
  type: ClusterIP
  selector:
    app: staff-scheduler
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
