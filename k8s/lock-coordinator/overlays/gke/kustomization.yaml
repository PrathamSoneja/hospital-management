apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hospital-system
resources:
  - ../../base
  - zookeeper-service-account.yaml
images:
  - name: lock-coordinator
    newName: asia-south1-docker.pkg.dev/PLACEHOLDER_PROJECT_ID/hospital-repo/lock-coordinator
    newTag: PLACEHOLDER_LOCK_COORDINATOR_IMAGE_TAG
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: zookeeper
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: zookeeper-sa
  - target:
      version: v1
      kind: ServiceAccount
      name: lock-coordinator-sa
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: PLACEHOLDER_LOCK_COORDINATOR_GSA

components:
  - ../../components/managed-prometheus