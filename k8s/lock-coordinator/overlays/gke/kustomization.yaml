apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hospital-system
resources:
  - ../../base
  - zookeeper-service-account.yaml
images:
  - name: lock-coordinator
    newName: asia-south1-docker.pkg.dev/hospital-management-514618/hospital-repo/lock-coordinator
    digest: sha256:18a4707d8382bac69af85b3e768a3ce62c4f3ad4b8faea89f681f745a1e4e5c3
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: zookeeper
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: zookeeper-sa
  - target:
      version: v1
      kind: ServiceAccount
      name: lock-coordinator-sa
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          iam.gke.io/gcp-service-account: hospital-lock-coordinator@hospital-management-514618.iam.gserviceaccount.com

components:
  - ../../components/managed-prometheus