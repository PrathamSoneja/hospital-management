apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hospital-system
resources:
  - ../../../staff-scheduler/base
images:
  - name: staff-scheduler
    newName: asia-south1-docker.pkg.dev/hospital-management-514618/hospital-repo/staff-scheduler
    digest: sha256:b8d5d7d9de1a8b7ce77c859e764b3e6870d6b109cab4108b2b88ec3d4c355f85
patches:
  - target: {kind: ServiceAccount, name: staff-scheduler-sa}
    patch: |-
      - op: replace
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: hospital-staff-scheduler@hospital-management-514618.iam.gserviceaccount.com
  - target: {kind: Deployment, name: staff-scheduler}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value  # FIRESTORE_PROJECT_ID
        value: hospital-management-514618
