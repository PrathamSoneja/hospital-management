# GKE Secret Manager add-on (secrets-store-gke.csi.k8s.io). Secret values never enter Git;
# the bed-allocation GSA needs roles/secretmanager.secretAccessor on exactly these secrets.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: allocation-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/hospital-management-514618/secrets/allocation-database-url/versions/latest"
        path: "database-url"
      # GCP-only phase (OUTBOX_DESTINATIONS=pubsub): the Kafka secrets have no versions yet and a missing
      # version fails the CSI mount, so they are not mounted. Restore these entries with Kafka.
      # - resourceName: "projects/hospital-management-514618/secrets/kafka-allocation-sasl-username/versions/latest"
      #   path: "kafka-sasl-username"
      # - resourceName: "projects/hospital-management-514618/secrets/kafka-allocation-sasl-password/versions/latest"
      #   path: "kafka-sasl-password"
