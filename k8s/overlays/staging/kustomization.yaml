# Bed Allocation + Triage on GKE (Argo CD path; RUNBOOK.md §A.3). The release gate rejects any
# PLACEHOLDER value. CI pins the image digests on each master merge; nothing here is applied by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hospital-system
resources:
  - ../../base
  - secret-provider-class.yaml
components:
  - ../../components/managed-prometheus   # GKE managed collection is enabled in Terraform (modules/gke)
images:
  - name: bed-allocation
    newName: asia-south1-docker.pkg.dev/hospital-management-514618/hospital-repo/bed-allocation
    digest: sha256:bbafa4b97a2376fc398b03a98fb47711ebd080d38d7cbed14b894ed2596e704b
  - name: triage
    newName: asia-south1-docker.pkg.dev/hospital-management-514618/hospital-repo/triage
    digest: sha256:a115c26169cd8b5d220ec37f93fccf07066ac33a37f9851fa891652a67912eb3
configMapGenerator:
  - name: allocation-config
    envs: [allocation.properties]
  - name: triage-config
    envs: [triage.properties]
patches:
  - target: {kind: ServiceAccount, name: bed-allocation-sa}
    patch: |-
      - op: replace
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: hospital-bed-allocation@hospital-management-514618.iam.gserviceaccount.com
  - target: {kind: ServiceAccount, name: triage-sa}
    patch: |-
      - op: replace
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: hospital-triage@hospital-management-514618.iam.gserviceaccount.com
