ENVIRONMENT=staging
LOG_LEVEL=INFO
CLOUD_SQL_INSTANCE_CONNECTION_NAME=hospital-management-514618:asia-south1:hospital-postgres
ENABLE_RECOVERY_WORKER=true
ENABLE_OUTBOX_WORKER=true
OUTBOX_CLAIM_SECONDS=30
OUTBOX_MAX_ATTEMPTS=12
OUTBOX_MAX_BACKOFF_SECONDS=300
OUTBOX_POLL_SECONDS=1
OUTBOX_PUBLISH_TIMEOUT_SECONDS=10
LOCK_SERVICE_ADDR=lock-coordinator-service:50051
BED_SERVICE_ADDR=bed-registry-service:50053
STAFF_SERVICE_ADDR=staff-scheduler-service:50051
TRIAGE_SERVICE_ADDR=triage-service:50051
PATIENT_SERVICE_URL=http://patient-registry-service:8000/api/v1
RPC_TIMEOUT_MS=2000
LOCK_WAIT_TIMEOUT_MS=5000
LOCK_LEASE_MS=10000
RECOVERY_CLAIM_SECONDS=60
PUBSUB_PROJECT_ID=hospital-management-514618
PUBSUB_TOPIC_NOTIFICATIONS=bed-notifications
# GCP-only phase: Kafka (Confluent Cloud) is not provisioned yet. The outbox delivers Pub/Sub only;
# bed-events rows stay PENDING in Postgres and drain in order once Kafka is enabled. To enable Kafka:
# set OUTBOX_DESTINATIONS=pubsub,kafka, uncomment and fill the four KAFKA_* lines, and restore the two
# Kafka entries in secret-provider-class.yaml (their Secret Manager secrets need versions first).
OUTBOX_DESTINATIONS=pubsub
# KAFKA_BOOTSTRAP_SERVERS=PLACEHOLDER_KAFKA_BOOTSTRAP
# KAFKA_TOPIC_BED_EVENTS=PLACEHOLDER_KAFKA_TOPIC
# KAFKA_SECURITY_PROTOCOL=PLACEHOLDER_KAFKA_SECURITY_PROTOCOL
# KAFKA_SASL_MECHANISM=PLACEHOLDER_KAFKA_SASL_MECHANISM
