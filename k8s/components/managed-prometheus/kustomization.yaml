# Optional: scrape /metrics with Google Cloud Managed Service for Prometheus.
# Requires managed collection on the cluster (Terraform monitoring_config currently enables
# only SYSTEM_COMPONENTS). Add `components: [../../components/managed-prometheus]` to an
# overlay once enabled; otherwise an in-cluster Prometheus uses the prometheus.io annotations.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - podmonitoring.yaml
