# Scrape /metrics with Google Cloud Managed Service for Prometheus (managed collection is enabled
# in infra/terraform/modules/gke). Included by k8s/overlays/staging. Managed collection ignores
# prometheus.io annotations; those remain for an in-cluster Prometheus.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - podmonitoring.yaml
