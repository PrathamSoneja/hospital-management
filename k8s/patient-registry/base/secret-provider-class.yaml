apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: patient-registry-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PLACEHOLDER_PROJECT_ID/secrets/patient-registry-database-url/versions/latest"
        path: "database-url"
