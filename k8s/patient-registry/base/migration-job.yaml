apiVersion: v1
kind: ServiceAccount
metadata:
  name: patient-registry-migration-sa
  annotations:
    iam.gke.io/gcp-service-account: PLACEHOLDER_PATIENT_REGISTRY_MIGRATION_GSA
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: patient-registry-migration-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PLACEHOLDER_PROJECT_ID/secrets/patient-registry-migration-database-url/versions/latest"
        path: "database-url"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patient-registry-migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: patient-registry-migration
    app.kubernetes.io/part-of: hospital-bed-management
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: patient-registry-migration
        app.kubernetes.io/part-of: hospital-bed-management
    spec:
      restartPolicy: Never
      serviceAccountName: patient-registry-migration-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --private-ip
            - --structured-logs
            - --port=5432
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - $(CLOUD_SQL_INSTANCE_CONNECTION_NAME)
          env:
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: patient-registry-config
                  key: CLOUD_SQL_INSTANCE_CONNECTION_NAME
          startupProbe:
            httpGet:
              path: /startup
              port: 9801
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          image: patient-registry
          command: ["sh", "-c"]
          args:
            - export PATIENT_REGISTRY_DATABASE_URL="$(cat /var/run/secrets/patient-registry/database-url)" && python -m alembic -c services/patient_registry/alembic.ini upgrade head
          volumeMounts:
            - name: migration-secret
              mountPath: /var/run/secrets/patient-registry
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: migration-secret
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: patient-registry-migration-secrets
