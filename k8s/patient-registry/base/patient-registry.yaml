apiVersion: v1
kind: ServiceAccount
metadata:
  name: patient-registry-sa
  annotations:
    iam.gke.io/gcp-service-account: PLACEHOLDER_PATIENT_REGISTRY_GSA
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-registry
  labels:
    app.kubernetes.io/name: patient-registry
    app.kubernetes.io/part-of: hospital-bed-management
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: patient-registry
  template:
    metadata:
      labels:
        app: patient-registry
        app.kubernetes.io/name: patient-registry
        app.kubernetes.io/part-of: hospital-bed-management
    spec:
      serviceAccountName: patient-registry-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --private-ip
            - --structured-logs
            - --port=5432
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - $(CLOUD_SQL_INSTANCE_CONNECTION_NAME)
          env:
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: patient-registry-config
                  key: CLOUD_SQL_INSTANCE_CONNECTION_NAME
          startupProbe:
            httpGet:
              path: /startup
              port: 9801
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: patient-registry
          image: patient-registry
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - export PATIENT_REGISTRY_DATABASE_URL="$(cat /var/run/secrets/patient-registry/database-url)" && exec python -m services.patient_registry.main
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PATIENT_REGISTRY_REST_HOST
              value: "0.0.0.0"
            - name: PATIENT_REGISTRY_REST_PORT
              value: "8000"
            - name: PATIENT_DOCUMENTS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: patient-registry-config
                  key: PATIENT_DOCUMENTS_BUCKET
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: patient-registry-config
                  key: GCP_PROJECT_ID
          volumeMounts:
            - name: database-secret
              mountPath: /var/run/secrets/patient-registry
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: database-secret
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: patient-registry-secrets
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: patient-registry-service
  labels:
    app.kubernetes.io/name: patient-registry
spec:
  type: ClusterIP
  selector:
    app: patient-registry
  ports:
    - name: http
      port: 8000
      targetPort: http
