# Argo CD child Applications for Allocation/Triage and its migration job.
# They remain manual-sync until their staging rollout is verified.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hospital-allocation-triage-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hospital-system
  source:
    repoURL: https://github.com/PrathamSoneja/hospital-management.git
    targetRevision: master
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: hospital-system
  # The HPA owns replicas; without this ArgoCD would report drift and reset scaling.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hospital-allocation-migrations-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hospital-system
  source:
    repoURL: https://github.com/PrathamSoneja/hospital-management.git
    targetRevision: master
    path: k8s/jobs/allocation-migrate
  destination:
    server: https://kubernetes.default.svc
    namespace: hospital-system
  syncPolicy: {}
