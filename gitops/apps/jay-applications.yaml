# Argo CD child Applications for Bed Registry and Resource Analytics.
# They remain manual-sync until their staging rollout is verified.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hospital-bed-registry-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hospital-system
  source:
    repoURL: https://github.com/PrathamSoneja/hospital-management.git
    targetRevision: master
    path: k8s/bed-registry/base
  destination:
    server: https://kubernetes.default.svc
    namespace: hospital-system
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hospital-resource-analytics-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hospital-system
  source:
    repoURL: https://github.com/PrathamSoneja/hospital-management.git
    targetRevision: master
    path: k8s/resource-analytics/base
  destination:
    server: https://kubernetes.default.svc
    namespace: hospital-system
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
